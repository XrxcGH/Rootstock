// dev.rootstock:rootstock-phoenix6 — the Phoenix 6 adapter.
//
// This is the ONLY artifact allowed to import com.ctre (ArchUnit rule 1). Everything it
// exposes is a Rootstock interface: TalonFXMotorIO implements MotorIO, Phoenix6GainSink
// implements GainSink. Core never sees a TalonFX type in a signature.

description = 'Rootstock Phoenix 6 adapter — TalonFX, TalonFXS, CANcoder, Pigeon 2, CANrange'

repositories {
    maven { url = 'https://maven.ctr-electronics.com/release/' }
}

dependencies {
    api project(':rootstock')
    api "com.ctre.phoenix6:wpiapi-java:${phoenix6Version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
}

// Same split as :rootstock. Tests that need a vendor JNI native (Phoenix's device handles, the HAL)
// are tagged "hal" and excluded from the default `test` task, so `./gradlew build` works on a desktop
// with no Phoenix natives installed. The gain-conversion tests deliberately do NOT need them:
// Slot0Configs and MotionMagicConfigs are plain configuration objects, verified to construct on a
// bare JVM, and Phoenix6GainSink takes its device writes as function parameters precisely so the
// arithmetic can be pinned without a CAN bus.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'hal'
    }
}

// There is no halTest task in this module, and that is a statement rather than an omission.
//
// This module has no hal-tagged test at all. Measured 2026-09-09:
// `grep -rl '@Tag("hal")' rootstock-phoenix6/src/test` matches zero files, and the whole test tree
// is two classes, PhoenixArchitectureTest and Phoenix6GainSinkTest. A halTest task here can only
// select zero tests, which is the failure mode rootstock/build.gradle names in terms: it looks like
// coverage and asserts nothing. One was registered here until now; it is gone.
//
// The excludeTags above is kept anyway, so `test` means the same thing in all three modules. If a
// Phoenix test that needs natives is ever written, it needs a task to run it: copy the natives
// configuration, the Copy task, the pinned Adoptium launcher and the java.library.path doFirst from
// rootstock/build.gradle, add Phoenix's own desktop natives to that set, then wire the new task
// into `verify` the way :rootstock does.
//
// Worth knowing before writing one: the Phoenix configuration objects do NOT need natives, so the
// conversions they carry belong in the default `test` task and not behind a tag. Measured
// 2026-09-09 on a bare JVM with only wpiapi-java-26.3.0 and the WPILib jars on the classpath and
// nothing on java.library.path: `new TalonFXConfiguration()` constructs, and Feedback
// .SensorToMechanismRatio, the three MotionMagic fields, SoftwareLimitSwitch.ForwardSoftLimitThreshold
// and Slot0.kP all take and return their values. What is missing is not a task. TalonFXMotorIO
// .buildConfig() is `private void` at line 210 and derives everything from instance fields, so no
// test can reach it without constructing a live TalonFX; giving it a package-private seam that
// takes its inputs as parameters is the change that would let the default build cover it.
