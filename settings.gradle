rootProject.name = 'Rootstock'

// D28: ONE published core artifact. The package boundaries inside it are enforced by
// ArchUnit (DESIGN.md section 8), so the artifact split stays available at zero cost
// without paying eleven POMs and eleven chances for a botched in-season publish.
//
// Vendor adapters are SEPARATE artifacts behind their own vendordeps, so a REV-only team
// never installs Phoenix and vice versa. ArchUnit rule 1 keeps every vendor import inside
// them. (-photonvision, -pathplanner, -choreo, -maplesim arrive at their milestones.)
include 'rootstock'
include 'rootstock-phoenix6'
include 'rootstock-revlib'
